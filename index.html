<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#303030" />
  <title>Zolva Studios</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #303030;
      color: #d8d8d8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 24px 28px;
    }
    .brand {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    main {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
    }
    p {
      margin: 0;
      color: #a8a8a8;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Zolva Studios</div>
  </header>
  <main>
    <p>Something is being built.</p>
  </main>
</body>
</html>
